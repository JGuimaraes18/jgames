<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <title>JGames — Jogos Educativos</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/game.css">
</head>

<body>
  <div class="app-shell">
    <!-- MENU LATERAL -->
    <aside class="sidebar" id="appSidebar" aria-label="Menu de jogos">
      <div class="sidebar-brand">
        <span class="sidebar-logo" aria-hidden="true">🎮</span>
        <div class="sidebar-brand-text">
          <div class="sidebar-title">JGames</div>
          <div class="sidebar-subtitle">Jogos educativos</div>
        </div>
        <button
          type="button"
          id="sidebarToggle"
          class="sidebar-toggle"
          aria-expanded="true"
          aria-label="Minimizar menu lateral"
          aria-controls="appSidebar"
          title="Minimizar menu"
        ></button>
      </div>

      <div class="player-field">
        <label for="playerName">Jogador</label>
        <input
          type="text"
          id="playerName"
          class="form-control form-control-sm"
          maxlength="30"
          autocomplete="off"
          aria-describedby="playerHint"
        >
        <small id="playerHint" class="player-hint">Seu nome aparece no recorde.</small>
      </div>

      <nav class="game-nav" aria-label="Escolha um jogo">
        <button type="button" class="btn game-btn game-btn--active" data-game="car-math">
          🧮 Matemática
        </button>
        <button type="button" class="btn game-btn" data-game="coming-soon" disabled>
          🔜 Em breve
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-outline-light btn-sm w-100" data-action="fullscreen" aria-pressed="false">
          <span class="ft-icon" aria-hidden="true">⛶</span>
          <span class="ft-label">Tela cheia</span>
        </button>
        <small class="sidebar-version">v1.0.0</small>
      </div>
    </aside>

    <!-- CONTEÚDO DINÂMICO -->
    <main class="main-area">
      <header class="main-header">
        <h1>🎮 Vamos Brincar</h1>
        <p class="main-subtitle">Escolha um jogo no menu e divirta-se aprendendo.</p>
      </header>

      <div id="content-area" class="content">
        <div class="content-message" role="status">
          <h2>👈 Escolha um jogo no menu</h2>
          <p>Que tal começar por <strong>Matemática</strong>?</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
